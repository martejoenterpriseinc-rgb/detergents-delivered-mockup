<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Detergents Delivered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="icon" href="logo.png" type="image/png" />
</head>
<body>
  <div class="page-shell">
    <div id="site-header"></div>
    <main class="page-main">
      <div class="page-header">
        <div class="container">
          <h1>Shop</h1>
          <p>Detergents, softeners, scent beads &amp; dish care — delivered.</p>
        </div>
      </div>
      <div class="container" style="padding:2rem 0 3rem">
        <div class="shop-layout">
          <aside class="filters" id="filters">
            <div class="filter-group">
              <h3>Category</h3>
              <label><input type="checkbox" name="category" value="liquid" /> Liquid detergent</label>
              <label><input type="checkbox" name="category" value="pods" /> Pods &amp; pacs</label>
              <label><input type="checkbox" name="category" value="powder" /> Powder</label>
              <label><input type="checkbox" name="category" value="softener" /> Softener</label>
              <label><input type="checkbox" name="category" value="beads" /> Scent beads</label>
              <label><input type="checkbox" name="category" value="dish" /> Dish care</label>
            </div>
            <div class="filter-group">
              <h3>Brand</h3>
              <div id="brand-filters"></div>
            </div>
            <button class="btn btn-ghost btn-sm btn-block" type="button" id="clear-filters">Clear filters</button>
          </aside>
          <div>
            <div class="shop-toolbar">
              <div class="count" id="result-count">Loading…</div>
              <select class="input" id="sort" style="width:auto;min-width:160px">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name">Name A–Z</option>
              </select>
            </div>
            <div class="product-grid" id="shop-grid"></div>
          </div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const brands = [...new Set(DD.PRODUCTS.map(p => p.brand))].sort();
      document.getElementById("brand-filters").innerHTML = brands.map(b =>
        `<label><input type="checkbox" name="brand" value="${b}" /> ${b}</label>`
      ).join("");

      const preCat = params.get("category");
      if (preCat) {
        const cb = document.querySelector(`input[name="category"][value="${preCat}"]`);
        if (cb) cb.checked = true;
      }

      function selected(name) {
        return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el => el.value);
      }

      function render() {
        let list = [...DD.PRODUCTS];
        const cats = selected("category");
        const brandSel = selected("brand");
        if (cats.length) list = list.filter(p => cats.includes(p.category));
        if (brandSel.length) list = list.filter(p => brandSel.includes(p.brand));
        const sort = document.getElementById("sort").value;
        if (sort === "price-asc") list.sort((a,b) => a.variants[0].price - b.variants[0].price);
        if (sort === "price-desc") list.sort((a,b) => b.variants[0].price - a.variants[0].price);
        if (sort === "name") list.sort((a,b) => a.name.localeCompare(b.name));
        document.getElementById("result-count").textContent =
          list.length + " product" + (list.length === 1 ? "" : "s");
        document.getElementById("shop-grid").innerHTML = list.length
          ? list.map(DD.productCardHTML).join("")
          : `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">🧹</div><p>No products match those filters.</p></div>`;
      }

      document.getElementById("filters").addEventListener("change", render);
      document.getElementById("sort").addEventListener("change", render);
      document.getElementById("clear-filters").addEventListener("click", () => {
        document.querySelectorAll("#filters input[type=checkbox]").forEach(c => c.checked = false);
        render();
      });
      render();
    });
  </script>
</body>
</html>
