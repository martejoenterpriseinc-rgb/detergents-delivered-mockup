<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change credentials — Detergents Delivered</title>
  <meta name="description" content="Demo first-login credential change for the Detergents Delivered UI mockup." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="icon" href="logo.png" type="image/png" />
</head>
<body>
  <div class="page-shell">
    <div id="site-header"></div>
    <main class="page-main">
      <div class="page-header">
        <div class="container">
          <h1>Change your credentials</h1>
          <p>First-login setup (demo) — update email/username and password before continuing.</p>
        </div>
      </div>
      <div class="container auth-wrap">
        <div class="demo-banner">⚠️ <span><strong>Forced change UX (mock).</strong> Nothing is saved. Continue to open the demo admin shell.</span></div>
        <div class="auth-card">
          <h1>Set new credentials</h1>
          <p class="lead-sm">Replace the bootstrap login with your preferred demo credentials.</p>
          <form id="change-form">
            <div class="form-row">
              <label for="new-email">New email / username</label>
              <input class="input" type="text" id="new-email" name="new-email" required
                placeholder="you@example.com"
                autocomplete="username" />
            </div>
            <div class="form-row">
              <label for="new-password">New password</label>
              <input class="input" type="password" id="new-password" name="new-password" required
                minlength="6"
                placeholder="At least 6 characters (demo)"
                autocomplete="new-password" />
            </div>
            <div class="form-row">
              <label for="confirm-password">Confirm new password</label>
              <input class="input" type="password" id="confirm-password" name="confirm-password" required
                minlength="6"
                placeholder="Re-enter password"
                autocomplete="new-password" />
              <div class="form-hint" id="pw-msg"></div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Save &amp; continue to admin</button>
          </form>
          <p style="margin:1.25rem 0 0;font-size:.875rem;color:var(--slate-500);text-align:center">
            <a href="sign-in.html">Back to sign in</a>
          </p>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("change-form");
      const msg = document.getElementById("pw-msg");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const a = document.getElementById("new-password").value;
        const b = document.getElementById("confirm-password").value;
        if (a !== b) {
          msg.textContent = "Passwords do not match.";
          msg.style.color = "var(--red-600)";
          return;
        }
        msg.textContent = "";
        location.href = "admin.html";
      });
    });
  </script>
</body>
</html>
